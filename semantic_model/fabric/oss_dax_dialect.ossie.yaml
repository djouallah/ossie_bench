# Fabric's model: the baseline (../a_baseline) in Ossie 0.2.0.dev0, the version Fabric reads, with all 16 measures
# in the DAX dialect.
# Extensions only for what Ossie has no field for: the measures' format strings (POWER_BI).
# Relationships point at the target's primary_key, so they are many-to-one; no cardinality extension needed.
version: 0.2.0.dev0
name: dax_context
description: Sales by day, store and product, and a monthly budget by country and category (2020-2022).
datasets:
- name: fact_sales
  source: dbo.fact_sales
  primary_key:
  - sale_date
  - store_id
  - product_id
  description: One row per day, store and product.
- name: fact_budget
  source: dbo.fact_budget
  primary_key:
  - month_start
  - country
  - category
  description: One row per month, country and category. month_start is the first day of the month.
- name: dim_calendar
  source: dbo.dim_calendar
  primary_key:
  - date_key
  description: Calendar 2020-2023, with 4-4-5 fiscal periods (52-week fiscal years starting 2019-12-30).
- name: dim_product
  source: dbo.dim_product
  primary_key:
  - product_id
  description: 40 products, 8 brands. Its category is a key to dim_category (Clearance has negative margins).
- name: dim_category
  source: dbo.dim_category
  primary_key:
  - category
  description: 4 categories, shared by sales (through product) and budget.
- name: dim_store
  source: dbo.dim_store
  primary_key:
  - store_id
  description: 55 stores; a customer is a store chain within one country. Its country is a key to dim_country.
- name: dim_country
  source: dbo.dim_country
  primary_key:
  - country
  description: 3 countries, shared by sales (through store) and budget.
relationships:
- name: sales_to_calendar
  from: fact_sales
  to: dim_calendar
  from_columns:
  - sale_date
  to_columns:
  - date_key
- name: sales_to_product
  from: fact_sales
  to: dim_product
  from_columns:
  - product_id
  to_columns:
  - product_id
- name: sales_to_store
  from: fact_sales
  to: dim_store
  from_columns:
  - store_id
  to_columns:
  - store_id
- name: product_to_category
  from: dim_product
  to: dim_category
  from_columns:
  - category
  to_columns:
  - category
- name: store_to_country
  from: dim_store
  to: dim_country
  from_columns:
  - country
  to_columns:
  - country
- name: budget_to_calendar
  from: fact_budget
  to: dim_calendar
  from_columns:
  - month_start
  to_columns:
  - date_key
- name: budget_to_category
  from: fact_budget
  to: dim_category
  from_columns:
  - category
  to_columns:
  - category
- name: budget_to_country
  from: fact_budget
  to: dim_country
  from_columns:
  - country
  to_columns:
  - country
metrics:
- name: sales_quantity
  description: Units sold.
  expression:
    dialects:
    - dialect: DAX
      expression: SUM(fact_sales[sales_qty])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: net_profit_total
  description: Net profit (negative for Clearance).
  expression:
    dialects:
    - dialect: DAX
      expression: SUM(fact_sales[net_profit])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: budget_quantity
  description: Budgeted units (month x country x category).
  expression:
    dialects:
    - dialect: DAX
      expression: SUM(fact_budget[budget_qty])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: sales_vs_budget_pct
  description: Actual against budget. Each side is evaluated at its own fact's grain, then compared.
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([sales_quantity] - [budget_quantity], [budget_quantity])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "0.0%"}'
- name: sales_qty_ly
  description: Sales quantity, same period last year (calendar).
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], SAMEPERIODLASTYEAR(dim_calendar[date_key]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: net_profit_ly
  description: Net profit, same period last year (calendar).
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([net_profit_total], SAMEPERIODLASTYEAR(dim_calendar[date_key]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: sales_qty_fly
  description: Sales quantity, same period last fiscal year (4-4-5, so 364 days back).
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], DATEADD(dim_calendar[date_key], -364, DAY))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: sales_qty_yoy_pct
  description: Sales quantity growth on last year.
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([sales_quantity] - [sales_qty_ly], [sales_qty_ly])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "0.0%"}'
- name: country_qty_all_customers
  description: Sales quantity of all the country's customers; every other filter kept (DAX ALL).
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], ALL(dim_store[customer]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: customer_share_all
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([sales_quantity], [country_qty_all_customers])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "0.0%"}'
- name: country_total_allselected
  description: Sales quantity of the visible customers of the country (DAX ALLSELECTED).
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], ALLSELECTED(dim_store[customer]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: customer_share_allselected
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([sales_quantity], [country_total_allselected])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "0.0%"}'
- name: country_total_allexcept
  description: DAX ALLEXCEPT(country, year). Every other filter removed, including a month's year when only the month is filtered.
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], ALLEXCEPT(fact_sales, dim_country[country], dim_calendar[year]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: country_total_fixed
  description: 'FIXED (country, year), Snowflake''s LOD: every filter removed, then the visible countries and years put back.'
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], REMOVEFILTERS(), VALUES(dim_country[country]), VALUES(dim_calendar[year]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: country_qty_all_cust_cat
  description: Sales quantity of all customers and categories of the country; every other filter kept.
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE([sales_quantity], REMOVEFILTERS(dim_store[customer]), REMOVEFILTERS(dim_category[category]))
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "#,##0"}'
- name: cust_cat_share_all
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([sales_quantity], [country_qty_all_cust_cat])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"formatString": "0.0%"}'
